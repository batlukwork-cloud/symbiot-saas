services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak_internal
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      - --hostname-strict=true
      - --health-enabled=true
      - --metrics-enabled=true
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./config/keycloak/symbiot-realm.json:/opt/keycloak/data/import/symbiot-realm.json:ro
    depends_on:
      - keycloak-db
    networks:
      - keycloak_internal
      - keycloak_proxy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
    volumes:
      - ./config/keycloak/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - keycloak
    networks:
      - keycloak_proxy
    restart: unless-stopped

volumes:
  keycloak_db_data:
  caddy_data:
  caddy_config:

networks:
  keycloak_internal:
    internal: true
  keycloak_proxy:
